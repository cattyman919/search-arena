[project]
name = "search-arena"
version = "0.1.0"
description = "Symbolic grid-world search strategy comparison demo (BFS, DFS, UCS, Greedy, A*)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
